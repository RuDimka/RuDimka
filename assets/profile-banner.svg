<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title description">
  <title id="title">Дмитрий — Python-разработчик</title>
  <desc id="description">Автоматизация, парсинг и обработка данных</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="0.58" stop-color="#172554"/>
      <stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#a5b4fc"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#dbeafe" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" rx="24" fill="url(#background)"/>
  <rect width="1200" height="300" rx="24" fill="url(#grid)"/>
  <circle cx="1060" cy="80" r="150" fill="#60a5fa" opacity="0.07"/>
  <circle cx="1080" cy="250" r="112" fill="#a78bfa" opacity="0.08"/>
  <path d="M895 0v300M930 0v300" stroke="#bfdbfe" stroke-opacity="0.08"/>

  <text x="76" y="83" fill="url(#accent)" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="2">PYTHON  /  АВТОМАТИЗАЦИЯ  /  ДАННЫЕ</text>
  <text x="72" y="157" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="52" font-weight="700">Привет, я Дмитрий</text>
  <text x="76" y="205" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="23">Разрабатываю автоматизации и парсеры на Python</text>
  <text x="76" y="252" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="17">Сбор данных · обработка · полезные инструменты</text>

  <g transform="translate(1000 150)">
    <circle r="75" fill="#0f172a" fill-opacity="0.42" stroke="#bfdbfe" stroke-opacity="0.32" stroke-width="2"/>
    <circle r="59" fill="none" stroke="url(#accent)" stroke-opacity="0.7" stroke-width="1.5"/>
    <text y="17" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="700">Py</text>
  </g>
</svg>
